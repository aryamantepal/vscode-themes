<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    
    <!-- Pokéball Top Gradient -->
    <linearGradient id="ballTop" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Pokéball Bottom Gradient -->
    <linearGradient id="ballBottom" x1="0" y1="128" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Background -->
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)" />

  <!-- Outer Poke-Ring / Aura -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 6" />

  <!-- Pokéball Outer Border -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#0f172a" stroke-width="8" />

  <!-- Pokéball Top (Cyan/Water theme) -->
  <path d="M48.5 128 C48.5 84 84 48.5 128 48.5 C172 48.5 207.5 84 207.5 128 Z" fill="url(#ballTop)" stroke="#0f172a" stroke-width="8" />

  <!-- Pokéball Bottom (Light Gray/Water theme) -->
  <path d="M48.5 128 C48.5 172 84 207.5 128 207.5 C172 207.5 207.5 172 207.5 128 Z" fill="url(#ballBottom)" stroke="#0f172a" stroke-width="8" />

  <!-- Center Horizontal Belt -->
  <line x1="48" y1="128" x2="208" y2="128" stroke="#0f172a" stroke-width="12" />

  <!-- Outer Button Circle -->
  <circle cx="128" cy="128" r="32" fill="#0f172a" />
  
  <!-- Middle Button Circle (White) -->
  <circle cx="128" cy="128" r="24" fill="#ffffff" stroke="#0f172a" stroke-width="4" />

  <!-- Inner Button Circle (Active Status Blue) -->
  <circle cx="128" cy="128" r="14" fill="#0ea5e9" />

  <!-- Code Brackets Overlay in Top/Bottom Areas (Stylized Water-Code theme) -->
  <!-- Left Bracket "<" -->
  <path d="M96 90 L80 100 L96 110" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket ">" -->
  <path d="M160 90 L176 100 L160 110" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Decorative Bubbles (Water Element) -->
  <circle cx="90" cy="70" r="6" fill="#ffffff" fill-opacity="0.6" />
  <circle cx="166" cy="74" r="4" fill="#ffffff" fill-opacity="0.5" />
  <circle cx="178" cy="64" r="8" fill="#ffffff" fill-opacity="0.4" />
</svg>
